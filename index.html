b').textContent='';document.getElementById('fim').textContent=acertos>=4?'Excelente leitura de mar! 🌊':'Revise o guia de Segurança e tente de novo 💪';return;}const p=perg[i];document.getElementById('q').textContent=(i+1)+'/5 · '+p[0];const ops=document.getElementById('ops');ops.innerHTML='';p[1].forEach((o,j)=>{const b=document.createElement('button');b.className='op';b.textContent=o;b.onclick=()=>{if(j===p[2]){b.classList.add('certa');acertos++;}else b.classList.add('errada');document.getElementById('fb').textContent=p[3];document.getElementById('q').style.pointerEvents='none';setTimeout(()=>{i++;render();},1400);};ops.appendChild(b);});}render();</script><footer style="text-align:center;padding:18px 12px;font-size:12px;color:#567;background:transparent">ASF — Associação de Surf Feminino · <a href="https://acarolmourad-commits.github.io/asf-app/privacidade.html" style="color:#00A8CC">Privacidade</a> · <a href="https://acarolmourad-commits.github.io/asf-app/cookies.html" style="color:#00A8CC">Cookies</a> · <a href="https://acarolmourad-commits.github.io/asf-app/termos-de-uso.html" style="color:#00A8CC">Termos</a></footer>
